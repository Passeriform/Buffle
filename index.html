<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/buffle.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Buffle</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Leckerli+One&family=Quicksand:wght@300..700&display=swap"
        />
        <link rel="stylesheet" href="/style.css" />
        <link rel="stylesheet" href="/game.css" />
    </head>

    <body>
        <buffle-menu></buffle-menu>
        <div id="game-container">
            <buffle-stats slot="stats" [data-stats]></buffle-stats>
            <div id="root"></div>
        </div>
        <buffle-game-over restart-key="r">
            <buffle-stats slot="stats" [data-stats]></buffle-stats>
            <buffle-leaderboard game-type="classic" autoscroll></buffle-leaderboard>
        </buffle-game-over>
        <script type="module" src="./src/components/registry.ts"></script>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
